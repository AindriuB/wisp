[package]
name = "wisp-storage"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "wisp_storage"

[dependencies]
wisp-core.workspace = true
toml_edit.workspace = true
notify.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
uuid.workspace = true

[features]
spike-keyring = ["dep:keyring"]
spike-win = ["dep:windows"]
spike-oo7 = ["dep:oo7", "dep:futures-lite"]
spike-mac = ["dep:security-framework"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", optional = true, default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }

[dependencies.keyring]
version = "4"
optional = true

[dev-dependencies]
tempfile.workspace = true
