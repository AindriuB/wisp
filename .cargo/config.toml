# Linux-only link flags (variant C). Scoped to the Linux target; macOS and
# Windows builds are unaffected. rustc 1.99 links with rust-lld by default on
# x86_64 Linux, so --icf=all is available.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--gc-sections", "-C", "link-arg=-Wl,--icf=all"]
