name: Measure

# Records binary size, idle RSS and RSS after one request per target.
# CI runners render in software (lavapipe, WARP) or inside a VM, so these
# figures are not comparable with a local hardware-rendered run.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: wisp
            renderer: unknown
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: wisp.exe
            renderer: software
          - target: x86_64-unknown-linux-gnu
            # glibc floor 2.39: ubuntu-latest is 26.04 and would need GLIBC_2.43
            os: ubuntu-24.04
            binary: wisp
            renderer: software
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GPUI build packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libasound2-dev libfontconfig-dev libgit2-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev make cmake clang lld llvm jq git curl \
            gettext-base elfutils libsqlite3-dev musl-tools musl-dev build-essential \
            pipewire xdg-desktop-portal libstdc++-14-dev \
            xvfb mesa-vulkan-drivers imagemagick
      - name: Install EGL/GL userspace and Vulkan tools (Linux)
        if: runner.os == 'Linux'
        run: |
          for pkg in libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 vulkan-tools; do
            sudo apt-get install -y "$pkg" || echo "::warning::could not install $pkg"
          done
      - name: Diagnose graphics stack (Linux)
        if: runner.os == 'Linux'
        run: |
          grep PRETTY_NAME /etc/os-release || true
          ls -la /usr/share/vulkan/icd.d/ || true
          xvfb-run -a vulkaninfo --summary || true
      - name: Install Metal Toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Verify Metal Toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcrun metal --version
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p wisp-app --target ${{ matrix.target }}
      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        run: scripts/release/check-glibc.sh target/${{ matrix.target }}/release/${{ matrix.binary }} 2.39
      - name: Measure (Linux, software Vulkan under xvfb)
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          RENDERER: ${{ matrix.renderer }}
          SCREENSHOT: measure-${{ matrix.target }}.png
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/measure/measure.sh target/${{ matrix.target }}/release/${{ matrix.binary }} measure-${{ matrix.target }}.json
      - name: List runtime packages (Linux)
        if: runner.os == 'Linux'
        run: |
          out=measure-${{ matrix.target }}.packages.txt
          libs=measure-${{ matrix.target }}.libs.txt
          {
            echo "## Debian packages owning the loaded shared objects"
            if [ -s "$libs" ]; then
              while IFS= read -r lib; do
                if owners="$(dpkg -S "$lib" 2>/dev/null)" && [ -n "$owners" ]; then
                  printf '%s\n' "$owners" | sed 's/: \/.*$//' | tr ',' '\n' | sed 's/^ *//; s/:[^:]*$//'
                else
                  echo "unowned: $lib"
                fi
              done <"$libs" | sort -u || true
            fi
            echo "## NEEDED entries of the binary"
            readelf -d target/${{ matrix.target }}/release/${{ matrix.binary }} | grep NEEDED || true
          } >"$out"
          cat "$out"
      - name: Measure (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          RENDERER: ${{ matrix.renderer }}
        run: scripts/measure/measure.sh target/${{ matrix.target }}/release/${{ matrix.binary }} measure-${{ matrix.target }}.json
      - name: Measure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RENDERER: ${{ matrix.renderer }}
        run: ./scripts/measure/measure.ps1 -Binary target/${{ matrix.target }}/release/${{ matrix.binary }} -Output measure-${{ matrix.target }}.json
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ matrix.target }}
          path: |
            measure-${{ matrix.target }}.json
            measure-${{ matrix.target }}.*.log
            measure-${{ matrix.target }}.png
            measure-${{ matrix.target }}.libs.txt
            measure-${{ matrix.target }}.packages.txt
          if-no-files-found: warn
