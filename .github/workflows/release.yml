name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Create a draft release dryrun-<run_id> from this run'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: wisp
            cli_binary: wisp-cli
            platform: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: wisp.exe
            cli_binary: wisp-cli.exe
            platform: windows-x64
          - target: x86_64-unknown-linux-gnu
            # glibc floor 2.39: ubuntu-latest is 26.04 and would need GLIBC_2.43
            os: ubuntu-24.04
            binary: wisp
            cli_binary: wisp-cli
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GPUI build packages: script/linux (apt list) at zed rev
      # 08cbb88a152c3751a43e853425a70e9f631a5918, the zed-rev recorded in the
      # pinned gpui-pre 0.3.10 snapshot. libstdc++-14-dev is the Ubuntu 24.04 extra.
      - name: Install GPUI build packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libasound2-dev libfontconfig-dev libgit2-dev \
            libglib2.0-dev libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev make cmake clang lld llvm jq git curl \
            gettext-base elfutils libsqlite3-dev musl-tools musl-dev build-essential \
            pipewire xdg-desktop-portal libstdc++-14-dev
      - name: Install Metal Toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Verify Metal Toolchain (macOS)
        if: runner.os == 'macOS'
        run: xcrun metal --version
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p wisp-app -p wisp-cli --target ${{ matrix.target }}
      - name: Check CLI size limit
        shell: bash
        run: |
          limit=$(jq -r '.limits["${{ matrix.target }}"]' scripts/measure/cli-budgets.json)
          cli=$(wc -c < "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}" | tr -d ' ')
          if ! [[ "$limit" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::no positive integer CLI limit for ${{ matrix.target }} in cli-budgets.json (got: $limit)"
            exit 1
          fi
          echo "wisp-cli size: $cli bytes, limit $limit"
          if [ "$cli" -gt "$limit" ]; then
            echo "::error::wisp-cli is $cli bytes, over its $limit limit"
            exit 1
          fi
      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/release/check-glibc.sh target/${{ matrix.target }}/release/${{ matrix.binary }} 2.39
          scripts/release/check-glibc.sh target/${{ matrix.target }}/release/${{ matrix.cli_binary }} 2.39
      - name: Select Windows signing mode
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_SIGNS_CLI: ${{ vars.SIGNPATH_SIGNS_CLI }}
        run: |
          all="SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          missing=""
          for n in $all; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -z "$missing" ]; then
            echo "WISP_WINDOWS_SIGN=signpath" >> "$GITHUB_ENV"
            if [ "$SIGNPATH_SIGNS_CLI" = true ]; then
              echo "WISP_WINDOWS_SIGN_CLI=true" >> "$GITHUB_ENV"
            else
              echo "::notice::wisp-cli.exe is unsigned because SIGNPATH_SIGNS_CLI is not true"
              echo "WISP_WINDOWS_SIGN_CLI=false" >> "$GITHUB_ENV"
            fi
          elif [ "$missing" = " $all" ]; then
            echo "::notice::Windows exe is unsigned because the SignPath settings are absent"
            echo "WISP_WINDOWS_SIGN=unsigned" >> "$GITHUB_ENV"
            echo "WISP_WINDOWS_SIGN_CLI=false" >> "$GITHUB_ENV"
          else
            echo "::error::Incomplete SignPath settings; missing:$missing"
            exit 1
          fi
      # The artifact holds wisp.exe, plus wisp-cli.exe only when SIGNPATH_SIGNS_CLI
      # is true (the SignPath configuration must then list both files).
      - name: Stage unsigned exes for signing (Windows)
        if: runner.os == 'Windows' && env.WISP_WINDOWS_SIGN == 'signpath'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/unsigned-exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ runner.temp }}/unsigned-exe/"
          if [ "$WISP_WINDOWS_SIGN_CLI" = true ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}" "${{ runner.temp }}/unsigned-exe/"
          fi
      - name: Upload unsigned exe for signing (Windows)
        if: runner.os == 'Windows' && env.WISP_WINDOWS_SIGN == 'signpath'
        id: unsigned-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-wisp-exe
          path: ${{ runner.temp }}/unsigned-exe
          if-no-files-found: error
      # The only provider-specific step: replace it to change signing provider.
      # It must leave the signed exes in ${{ runner.temp }}/signed-exe.
      - name: Sign Windows exe (SignPath)
        if: runner.os == 'Windows' && env.WISP_WINDOWS_SIGN == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for manual approval in SignPath; cap at 60 minutes.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signed-exe
      - name: Put signed exe back (Windows)
        if: runner.os == 'Windows' && env.WISP_WINDOWS_SIGN == 'signpath'
        shell: bash
        run: |
          cp "${{ runner.temp }}/signed-exe/${{ matrix.binary }}" "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ "$WISP_WINDOWS_SIGN_CLI" = true ]; then
            cp "${{ runner.temp }}/signed-exe/${{ matrix.cli_binary }}" "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}"
          fi
      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.WISP_WINDOWS_SIGN == 'signpath'
        shell: pwsh
        run: |
          scripts/release/sign-windows/verify.ps1 -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:WISP_WINDOWS_SIGN_CLI -eq 'true') {
            scripts/release/sign-windows/verify.ps1 -Path "target/${{ matrix.target }}/release/${{ matrix.cli_binary }}"
          }
      - name: Check Windows exe size
        if: runner.os == 'Windows'
        shell: bash
        run: |
          size=$(stat -c %s "target/${{ matrix.target }}/release/${{ matrix.binary }}")
          echo "wisp.exe size: $size bytes (mode: $WISP_WINDOWS_SIGN)"
          if [ "$size" -gt 16000000 ]; then
            echo "::error::wisp.exe is $size bytes, over the 16000000 limit"
            exit 1
          fi
      # Read by the release job to word the draft release notes.
      - name: Record CLI signing state (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p cli-signing
          if [ "$WISP_WINDOWS_SIGN_CLI" = true ]; then echo signed > cli-signing/state; else echo unsigned > cli-signing/state; fi
      - name: Upload CLI signing state (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta-windows-cli-signing
          path: cli-signing/state
          if-no-files-found: error
      # Store identity comes from repository variables; an unset one makes pack.ps1
      # emit a placeholder notice and use a marked placeholder value.
      - name: Build MSIX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: packaging/msix/pack.ps1 -Exe "target/${{ matrix.target }}/release/${{ matrix.binary }}" -OutDir msix-out
      # Not pkg-*: the release job must not attach it or list it in SHA256SUMS.
      - name: Upload MSIX (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-windows-x64
          path: msix-out/*.msix
          if-no-files-found: error
      - name: Select macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          for n in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -z "$missing" ]; then
            echo "WISP_MACOS_SIGN=developer-id" >> "$GITHUB_ENV"
          elif [ "$missing" = " APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::Release tag push needs the Developer ID secrets; missing:$missing"
              exit 1
            fi
            echo "::notice::macOS release is ad-hoc signed and not notarised because the Developer ID secrets are absent"
            echo "WISP_MACOS_SIGN=adhoc" >> "$GITHUB_ENV"
          else
            echo "::error::Incomplete Developer ID secrets; missing:$missing"
            exit 1
          fi
      - name: Set up signing keychain (macOS)
        if: runner.os == 'macOS' && env.WISP_MACOS_SIGN == 'developer-id'
        shell: bash
        env:
          APPLE_TEAM_ID: UB89GDN343
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/release/macos-keychain.sh setup
      - name: Package
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER_ID || '' }}
          APPLE_API_KEY_P8: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_P8 || '' }}
        run: scripts/release/package.sh ${{ matrix.platform }} target/${{ matrix.target }}/release/${{ matrix.binary }} dist target/${{ matrix.target }}/release/${{ matrix.cli_binary }}
      - name: Clean up signing material (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: scripts/release/macos-keychain.sh cleanup
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Download CLI signing state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-windows-cli-signing
          path: cli-signing
      - name: Release notes
        id: notes
        run: |
          if [ "$(cat cli-signing/state)" = signed ]; then
            printf '' > notes.md
          else
            echo "wisp-cli.exe in this release is not code-signed." > notes.md
          fi
      - name: Checksums and version
        id: meta
        run: |
          cd dist
          ls -1
          [ "$(ls -1 | wc -l)" = 3 ] || { echo "expected exactly 3 archives" >&2; exit 1; }
          versions="$(ls -1 | sed -E 's/^Wisp-(.+)-(macos-arm64|windows-x64|linux-x64)\.(zip|tar\.gz)$/\1/' | sort -u)"
          [ "$(echo "$versions" | wc -l)" = 1 ] || { echo "archives disagree on version: $versions" >&2; exit 1; }
          echo "version=$versions" >> "$GITHUB_OUTPUT"
          sha256sum Wisp-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wisp-${{ steps.meta.outputs.version }}-release
          path: dist/*
          if-no-files-found: error
      - name: Check tag matches version (tag push)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          [ "$GITHUB_REF_NAME" = "v${{ steps.meta.outputs.version }}" ] || {
            echo "tag $GITHUB_REF_NAME does not equal v${{ steps.meta.outputs.version }}" >&2; exit 1; }
      - name: Create draft release (tag push)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Wisp ${{ steps.meta.outputs.version }}" --notes-file notes.md dist/*
      - name: Create draft dry-run release (dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.draft_release
        run: |
          gh release create "dryrun-${{ github.run_id }}" --draft --target "${{ github.sha }}" \
            --title "dryrun-${{ github.run_id }}" --notes-file notes.md dist/*
