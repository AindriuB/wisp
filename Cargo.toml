[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[workspace.dependencies]
wisp-core = { path = "crates/core" }
wisp-storage = { path = "crates/storage" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
async-channel = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
anyhow = { version = "1", default-features = false, features = ["std"] }
wiremock = { version = "0.6", default-features = false }
# Features unify across members: Linux backends (wayland, x11) are enabled on the platform crate only.
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
gpui-component = { version = "=0.8.1", default-features = false }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
percent-encoding = { version = "2", default-features = false, features = ["std"] }
toml_edit = { version = "=0.22.27", default-features = false, features = ["parse", "display"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tempfile = { version = "3", default-features = false }
